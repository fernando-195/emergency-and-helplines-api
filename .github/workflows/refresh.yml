# Rebuild the dataset from Wikipedia every three months, and commit whatever changed.
#
# The commit is the point. A number that changes on Wikipedia becomes a line in the diff here, with
# a date, so anyone depending on this can see exactly what moved and when. Silent updates would make
# the dataset less trustworthy, not more.
#
# Also runs on every push and pull request, without committing, so a parser change that breaks the
# output fails before it lands.

name: Refresh dataset

on:
  schedule:
    # 03:17 UTC on the 1st of January, April, July and October. An odd minute on purpose: scheduled
    # jobs on the hour queue behind everyone else's.
    - cron: "17 3 1 1,4,7,10 *"
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build from Wikipedia
        run: node src/build.mjs

      - name: Test
        run: node src/test.mjs

      # Only the scheduled and manual runs write back. A pull request from a fork must never be able
      # to commit to this repository.
      - name: Commit the diff
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          if git diff --quiet -- data; then
            echo "Nothing changed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "data: quarterly refresh from Wikipedia

          $(git diff --cached --stat -- data | tail -1)"
          git push
